name: Validate Matrix theme

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/validate-matrix-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed TypeScript files
        run: npx eslint src/app.tsx src/brand/MatrixBackdrop.tsx src/shared/constants/theme/theme.ts

      - name: Lint changed stylesheet
        run: npx stylelint src/global.css

      - name: Build
        run: npm run start:build
